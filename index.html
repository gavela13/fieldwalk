<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="FieldWalk">

<title>Field Walk</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='34' fill='%23111'/%3E%3Ctext x='90' y='118' font-family='Helvetica,Arial' font-size='82' font-weight='bold' fill='%23fff' text-anchor='middle'%3EFW%3C/text%3E%3C/svg%3E">
<style>
:root{
  --ink:#111; --bg:#fff; --mut:#5a5a5a; --line:#d4d4d4; --soft:#f4f4f4;
  --new:#0a6b24; --newbg:#eaf6ed; --rm:#8a5200; --rmbg:#fdf3e3;
  --bad:#b00018; --badbg:#fdeaec; --warn:#8a5200;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{font:17px/1.4 -apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
  color:var(--ink);background:var(--bg);overscroll-behavior:contain;
  padding-bottom:calc(84px + env(safe-area-inset-bottom))}
button,input,textarea,select{font:inherit;font-size:17px;color:var(--ink)}
button{touch-action:manipulation;cursor:pointer;background:none;border:0}

/* ---------- chrome ---------- */
header{position:sticky;top:0;z-index:40;background:var(--bg);
  border-bottom:2px solid var(--ink);padding-top:env(safe-area-inset-top)}
.hbar{display:flex;align-items:center;gap:8px;padding:8px 12px;min-height:52px}
.hbar .back{font-weight:700;font-size:16px;padding:8px 10px;margin-left:-10px;
  border-radius:8px}
.hbar .ttl{flex:1;font-weight:700;font-size:17px;line-height:1.15;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbar .ttl small{display:block;font-weight:400;font-size:12px;color:var(--mut);
  text-transform:uppercase;letter-spacing:.8px}
.dot{width:11px;height:11px;border-radius:50%;background:var(--new);flex:none}
.dot.bad{background:var(--bad)}
.hbtn{border:2px solid var(--ink);border-radius:9px;padding:9px 12px;font-weight:700;
  font-size:14px;white-space:nowrap}
.banner{background:var(--bad);color:#fff;padding:10px 12px;font-weight:700;font-size:14px}
.banner.zero{background:var(--ink)}
.banner small{display:block;font-weight:400;font-size:12.5px;opacity:.92;margin-top:2px}

footer{position:fixed;bottom:0;left:0;right:0;z-index:40;background:var(--ink);
  color:#fff;padding:8px 12px calc(8px + env(safe-area-inset-bottom));
  font-size:12.5px;display:flex;gap:10px;align-items:center}
footer .f1{flex:1;line-height:1.3}
footer b{font-size:14px}
footer .fx{border:1.5px solid #fff;border-radius:8px;padding:8px 11px;color:#fff;
  font-weight:700;font-size:13px}

main{padding:12px}
.wrap{max-width:720px;margin:0 auto}

/* ---------- lists / tiles ---------- */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
@media (max-width:420px){.grid{grid-template-columns:1fr}}
.tile{border:2px solid var(--line);border-radius:12px;padding:11px 12px;text-align:left;
  display:block;width:100%;background:var(--bg)}
.tile.zero{border-color:var(--ink);background:#fff}
.tile.part{border-color:var(--warn);background:#fffdf7}
.tile.done{border-color:var(--new);background:var(--newbg)}
.tile .b{font-size:25px;font-weight:800;letter-spacing:-.5px;line-height:1}
.tile .d{font-size:13px;color:var(--mut);margin:3px 0 7px;line-height:1.25;
  min-height:2.4em}
.tile .m{font-size:12.5px;font-weight:600;display:flex;gap:9px;flex-wrap:wrap}
.tile .pri{display:inline-block;background:var(--ink);color:#fff;font-size:10.5px;
  font-weight:800;letter-spacing:.8px;padding:2px 6px;border-radius:4px;
  margin-top:5px}
.tile .fl{font-size:11.5px;color:var(--bad);font-weight:700;margin-top:4px}

.row{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);
  padding:14px 4px;min-height:56px;display:flex;align-items:center;gap:10px;
  background:var(--bg)}
.row .tick{width:26px;flex:none;font-size:19px;text-align:center;font-weight:800}
.row .rl{flex:1;font-weight:600}
.row .rl small{display:block;font-weight:400;font-size:12.5px;color:var(--mut)}
.row .rr{font-size:13px;color:var(--mut);text-align:right;font-weight:600}
.row.on .rl{color:var(--new)}

/* ---------- forms ---------- */
.sec{margin:14px 0 6px;font-size:11.5px;font-weight:800;text-transform:uppercase;
  letter-spacing:1.1px;color:var(--mut)}
.fld{margin-bottom:12px}
.fld>label{display:block;font-size:13px;font-weight:700;margin-bottom:5px}
.fld .hint{font-size:12.5px;color:var(--mut);margin-top:4px;line-height:1.35}
input[type=text],textarea,select{width:100%;border:2px solid var(--line);border-radius:10px;
  padding:13px;min-height:52px;background:var(--bg)}
textarea{min-height:88px;line-height:1.4}
input:focus,textarea:focus,select:focus{outline:0;border-color:var(--ink)}

.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:2px solid var(--line);border-radius:999px;padding:11px 14px;font-size:15px;
  font-weight:600;min-height:46px;background:var(--bg)}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip.used{opacity:.42}
.chip.sm{padding:8px 11px;font-size:13.5px;min-height:38px}

.big-ok{width:100%;border:3px solid var(--new);background:var(--newbg);color:var(--new);
  border-radius:12px;padding:18px;font-size:18px;font-weight:800;min-height:64px;
  letter-spacing:.2px}
.big-ok.on{background:var(--new);color:#fff}

.block{border:2px solid var(--line);border-left-width:9px;border-radius:10px;
  padding:12px;margin-bottom:11px}
.block.new{border-color:var(--new);background:var(--newbg)}
.block.rm{border-color:var(--rm);background:var(--rmbg)}
.block h4{font-size:14px;font-weight:800;letter-spacing:.3px;text-transform:uppercase}
.block .why{font-size:12.5px;color:#333;margin:3px 0 10px;line-height:1.35}
.step{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.step .sl{flex:1;font-size:15px;font-weight:600}
.step .sv{font-size:23px;font-weight:800;min-width:46px;text-align:center}
.pm{width:56px;height:56px;border:2px solid var(--ink);border-radius:11px;
  font-size:26px;font-weight:700;line-height:1;flex:none;background:var(--bg)}
.tot{border-top:2px solid currentColor;margin-top:9px;padding-top:9px;
  display:flex;justify-content:space-between;align-items:baseline;font-weight:800}
.tot .tv{font-size:34px;letter-spacing:-1px;line-height:1}
.ruleline{font-size:12px;text-align:center;color:var(--mut);font-weight:700;
  letter-spacing:.2px;margin:-4px 0 11px}

/* keypad */
.kp-val{border:2px solid var(--ink);border-radius:10px;padding:12px;text-align:center;
  font-size:34px;font-weight:800;letter-spacing:-1px;min-height:62px}
.kp-val.cne{border-color:var(--warn);background:var(--rmbg);color:var(--warn);
  font-size:16px;font-weight:800;letter-spacing:0;line-height:1.25;padding:10px}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:8px}
.kp button{border:2px solid var(--line);border-radius:10px;height:56px;font-size:23px;
  font-weight:700;background:var(--bg)}
.kp button.wide{grid-column:span 2}
.cne-btn{width:100%;border:2px solid var(--warn);color:var(--warn);background:var(--rmbg);
  border-radius:10px;padding:14px;font-weight:800;font-size:15px;margin-top:8px;
  min-height:54px}
.cne-btn.on{background:var(--warn);color:#fff}
.sub-live{font-size:14px;font-weight:700;margin-top:8px;padding:9px;border-radius:9px;
  background:var(--soft);text-align:center}
.sub-live.none{color:var(--mut)}
.overmax{color:var(--bad);font-weight:700;font-size:12.5px;margin-top:5px}

details.t2{border:2px solid var(--line);border-radius:10px;margin:12px 0}
details.t2>summary{padding:14px;font-weight:700;font-size:15px;cursor:pointer;
  list-style:none;min-height:52px;display:flex;align-items:center;gap:8px}
details.t2>summary::-webkit-details-marker{display:none}
details.t2>summary:after{content:"optional — fill at the desk";font-weight:400;
  font-size:12px;color:var(--mut);margin-left:auto}
details.t2[open]>summary{border-bottom:1px solid var(--line)}
details.t2 .in{padding:12px}

.save{position:fixed;bottom:calc(56px + env(safe-area-inset-bottom));left:0;right:0;
  z-index:39;padding:9px 12px;background:linear-gradient(transparent,var(--bg) 42%)}
.save button{width:100%;border:2px solid var(--ink);background:var(--ink);color:#fff;
  border-radius:12px;padding:17px;font-size:18px;font-weight:800;min-height:60px}
.save .two{display:flex;gap:8px}
.save .two button.alt{background:var(--bg);color:var(--ink);flex:0 0 38%}

.note{border:2px solid var(--line);border-radius:10px;padding:11px;font-size:13.5px;
  line-height:1.4;margin-bottom:11px;background:var(--soft)}
.note.flag{border-color:var(--bad);background:var(--badbg)}
.note.flag b{color:var(--bad)}
.note ul{padding-left:18px;margin-top:4px}
.note li{margin:3px 0}

textarea.raw{width:100%;min-height:46vh;font:12px/1.45 ui-monospace,Menlo,Consolas,monospace;
  -webkit-user-select:text;user-select:text}
.ex-btn{width:100%;border:2px solid var(--ink);border-radius:11px;padding:16px;
  font-weight:800;font-size:16px;margin-bottom:8px;min-height:58px;background:var(--bg)}
.ex-btn.pri{background:var(--ink);color:#fff}
.sum{font:12.5px/1.5 ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap;
  border:2px solid var(--line);border-radius:10px;padding:11px;margin-bottom:11px;
  background:var(--soft)}
.hidden{display:none !important}
</style>
</head>
<body>

<main><div class="wrap" id="view"></div></main>
<div class="save hidden" id="savebar"></div>
<footer>
  <div class="f1" id="foot">&nbsp;</div>
  <button class="fx" id="miss">Missing</button>
</footer>

   0. RAW RESCUE ROUTE. Runs before anything else can throw.
   ------------------------------------------------------------------ */
(function rawRoute(){
  if (location.hash !== "#raw") return;
  var out = "=== FIELD WALK RAW STORAGE DUMP ===\n" + new Date().toString() + "\n\n";
  try {
    for (var i = 0; i < localStorage.length; i++) {
      var k = localStorage.key(i);
      out += "----- " + k + " -----\n" + localStorage.getItem(k) + "\n\n";
    }
  } catch (e) { out += "!! localStorage threw: " + e.name + " " + e.message + "\n"; }
  document.body.innerHTML =
    '<div style="padding:12px;font:14px -apple-system,Arial">' +
    '<b>Raw storage dump.</b> Select all and email it to yourself. ' +
    '<a href="#">Back to app</a> (then reload).' +
    '<textarea readonly style="width:100%;min-height:70vh;font:11px ui-monospace,Menlo,monospace;' +
    '-webkit-user-select:text;margin-top:8px"></textarea></div>';
  var ta = document.querySelector("textarea");
  ta.value = out; ta.select();
  throw new Error("raw-route");   // stop the rest of the app booting
})();

/* ------------------------------------------------------------------
   1. STORAGE: alternating double buffer + read-back verification.
   ------------------------------------------------------------------ */
var KA = "rk26110.v1.a", KB = "rk26110.v1.b", KM = "rk26110.v1.meta",
    KJ = "rk26110.v1.journal";
var storageOk = true, storageErr = "", meta = {newest:null, seq:0, savedAt:null};

function lsGet(k){ try { return localStorage.getItem(k); }
  catch(e){ storageOk=false; storageErr=e.name+": "+e.message; return null; } }
function lsSet(k,v){ try { localStorage.setItem(k,v); return true; }
  catch(e){ storageOk=false; storageErr=e.name+": "+e.message; return false; } }
function lsDel(k){ try { localStorage.removeItem(k); } catch(e){} }

function readMeta(){
  try { var m = JSON.parse(lsGet(KM)||"null"); if (m && typeof m==="object") return m; }
  catch(e){}
  return {newest:null, seq:0, savedAt:null};
}

var S = null, bootNote = "";

function loadState(){
  meta = readMeta();
  var order = meta.newest === "b" ? [KB,KA] : [KA,KB];
  for (var i=0;i<order.length;i++){
    var raw = lsGet(order[i]);
    if (!raw) continue;
    try {
      var st = JSON.parse(raw);
      if (st && st.v === 1) {
        if (i === 1) bootNote = "Recovered from the backup buffer — the newer write was unreadable.";
        return st;
      }
    } catch(e){}
  }
  if (lsGet(KA) || lsGet(KB)) {
    bootNote = "BOTH saved copies failed to parse. Open #raw and email the text before entering anything.";
  }
  return null;
}

function freshState(){
  return {v:1, device:null, seq:{a:0,c:0,p:0,q:13,ph:0},
          areas:{}, closets:{}, paths:{}, facs:{}, qs:{}, photos:{},
          bstat:{}, lastArea:null, checkpointAt:null};
}

function persist(){
  if (!storageOk) return false;
  var target = meta.newest === "a" ? "b" : "a";
  var key = target === "a" ? KA : KB;
  var body;
  try { body = JSON.stringify(S); } catch(e){ storageOk=false; storageErr="serialize: "+e.message; return false; }
  if (!lsSet(key, body)) {                       // quota? shed the journal, retry once
    lsDel(KJ);
    if (!lsSet(key, body)) return false;
    storageOk = true;
  }
  if (lsGet(key) !== body) { storageOk=false; storageErr="read-back mismatch"; return false; }
  meta = {newest:target, seq:(meta.seq||0)+1, savedAt:new Date().toISOString()};
  lsSet(KM, JSON.stringify(meta));
  return true;
}

/* append-only field-level journal — hand-reconstructable if state ever dies */
function journal(kind, id, field, val){
  if (!storageOk) return;
  try {
    var j = lsGet(KJ) || "";
    var line = hhmmss() + "|" + kind + "|" + id + "|" + field + "|" +
               String(val === undefined ? "" : val).slice(0,60).replace(/[|\n\r]/g," ");
    var lines = (j ? j.split("\n") : []);
    lines.push(line);
    if (lines.length > 400) lines = lines.slice(-400);
    lsSet(KJ, lines.join("\n"));
  } catch(e){}
}

var saveTimer = null;
function queueSave(){ clearTimeout(saveTimer); saveTimer = setTimeout(flushSave, 300); }
function flushSave(){ clearTimeout(saveTimer); persist(); paintChrome(); }

["pagehide","blur"].forEach(function(ev){ window.addEventListener(ev, flushSave); });
document.addEventListener("visibilitychange", function(){
  if (document.visibilityState === "hidden") flushSave();
});

/* ------------------------------------------------------------------
   2. helpers
   ------------------------------------------------------------------ */
function $(id){ return document.getElementById(id); }
function esc(t){ return String(t==null?"":t).replace(/[&<>"']/g, function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function pad2(n){ return (n<10?"0":"")+n; }
function hhmmss(){ var d=new Date(); return pad2(d.getHours())+":"+pad2(d.getMinutes())+":"+pad2(d.getSeconds()); }
function hhmm(){ var d=new Date(); return pad2(d.getHours())+":"+pad2(d.getMinutes()); }
function bkey(site,b){ return site+"|"+b; }
function bld(site,b){
  for (var i=0;i<DATA.buildings.length;i++){
    var x=DATA.buildings[i];
    if (x.site===site && x.b===b) return x;
  } return null;
}
function vals(o){ var r=[]; for (var k in o) if (o.hasOwnProperty(k)) r.push(o[k]); return r; }
function nextSeq(which){ S.seq[which] = (S.seq[which]||0)+1; return S.seq[which]; }
function devCode(){ return S.device || "T"; }

/* ------------------------------------------------------------------
   3. router
   ------------------------------------------------------------------ */
var NAV = {screen:"sites", site:null, b:null, tab:"rooms", rec:null, kind:null};
var stack = [];

function go(next, push){
  if (push !== false) stack.push(JSON.parse(JSON.stringify(NAV)));
  NAV = next;
  render();
}
function back(){
  if (!stack.length) { NAV = {screen:"sites"}; }
  else NAV = stack.pop();
  render();
}
$("back").addEventListener("click", back);

/* ------------------------------------------------------------------
   4. progress model
   ------------------------------------------------------------------ */
function areasOf(site,b){
  return vals(S.areas).filter(function(a){ return a.site===site && a.b===b && a.touched; });
}
function closetsOf(site,b){
  return vals(S.closets).filter(function(c){ return c.site===site && c.b===b; });
}
function facsOf(site,b){
  return vals(S.facs).filter(function(f){ return f.site===site && f.priceTo===b; });
}
function pathsOf(site,b){
  return vals(S.paths).filter(function(p){ return p.site===site && p.b===b; });
}
function recCount(site,b){
  return areasOf(site,b).length + closetsOf(site,b).length +
         facsOf(site,b).length + pathsOf(site,b).length;
}
/* A record counts toward the room tally if it was created from a classroom
   stub. Older records predate the flag, so fall back to the reference list. */
function isCountedRoom(def, rec){
  if (typeof rec.kindRoom === "boolean") return rec.kindRoom;
  return def.classrooms.indexOf(rec.room) >= 0;
}
function countedRooms(site,b){
  var def = bld(site,b);
  return areasOf(site,b).filter(function(a){ return isCountedRoom(def,a); }).length;
}
function bStatus(site,b){
  var def = bld(site,b);
  var ar = areasOf(site,b), cl = closetsOf(site,b);
  if (recCount(site,b) === 0) return "zero";
  var wantRooms = def.classrooms.length;
  var haveRooms = countedRooms(site,b);
  var allLen = ar.every(function(a){ return a.routeFt !== null || a.cne; });
  var needCl = def.switches.length > 0;
  if (haveRooms >= wantRooms && allLen && (!needCl || cl.length > 0)) return "done";
  return "part";
}
function siteTotals(site){
  var bs = DATA.buildings.filter(function(x){ return x.site===site; });
  var zero=0, part=0, done=0, ar=0, dr=0, ft=0, cl=0, fa=0, cne=0;
  bs.forEach(function(x){
    var st = bStatus(site,x.b);
    if (st==="zero") zero++; else if (st==="part") part++; else done++;
    var a = areasOf(site,x.b);
    ar += a.length; cl += closetsOf(site,x.b).length; fa += facsOf(site,x.b).length;
    a.forEach(function(r){
      dr += totNew(r);
      ft += sub(r) || 0;
      if (r.cne) cne++;
    });
  });
  return {lines:bs.length, zero:zero, part:part, done:done, areas:ar, drops:dr,
          ft:ft, closets:cl, facs:fa, cne:cne};
}
function totNew(r){ return (r.clg||0)+(r.wall||0)+(r.spk||0)+(r.oth||0); }
function sub(r){
  if (r.routeFt === null || r.routeFt === undefined) return null;
  var t = totNew(r); if (!t) return null;
  return t * (r.routeFt + (r.loops||0));
}

function paintChrome(){
  $("dot").className = "dot" + (storageOk ? "" : " bad");
  var bs = [];
  if (!storageOk) bs.push('<div class="banner">STORAGE FAILED — DATA IS IN MEMORY ONLY.'+
    '<small>Copy out after every room: tap Export, then Show raw text. '+esc(storageErr)+'</small></div>');
  if (bootNote) bs.push('<div class="banner">'+esc(bootNote)+'</div>');
  if (NAV.screen === "bldgs" && NAV.site) {
    var t = siteTotals(NAV.site);
    if (t.zero > 0) bs.push('<div class="banner zero">'+t.zero+' of '+t.lines+
      ' '+NAV.site+' buildings still have ZERO records'+
      '<small>A blank Appendix B line reads as NO BID. Breadth before depth.</small></div>');
  }
  $("banners").innerHTML = bs.join("");

  var f = "";
  if (S && S.device) {
    var a = siteTotals("RHS"), b = siteTotals("RES");
    f = "<b>"+(a.areas+b.areas)+"</b> areas · <b>"+(a.closets+b.closets)+"</b> closets · <b>"+
        (a.drops+b.drops)+"</b> new drops<br>device "+devCode()+" · "+
        (meta.savedAt ? "saved "+new Date(meta.savedAt).toTimeString().slice(0,8) : "not saved") +
        (storageOk ? "" : " · SAVE FAILING");
  }
  $("foot").innerHTML = f || "&nbsp;";
  $("back").className = "back" + (stack.length ? "" : " hidden");
}

      '<div class="d">'+esc(si.name)+'<br>'+esc(si.addr)+'</div>'+
      '<div class="m"><span>'+t.lines+' bid lines</span><span>'+si.rooms+' ref rooms</span></div>'+
      '<div class="m" style="margin-top:4px"><span>'+t.done+' done</span>'+
      '<span>'+t.part+' partial</span><span style="color:var(--bad)">'+t.zero+' ZERO</span></div>'+
      (t.zero ? '<span class="pri">'+t.zero+' BUILDINGS NOT STARTED</span>' : '')+
      '</button>';
  });
  html += '<div class="note"><b>Walk order.</b> '+esc(DATA.walk.first)+' at '+
    esc(DATA.walk.start)+', about 4 hours. Then '+esc(DATA.walk.second)+'. '+
    '<b>Sign in at both sites.</b></div>'+
    '<div class="note flag"><b>The counting rule</b><br>'+
    'existing to replace + additional required = <b>total new CAT6A to install</b>. '+
    'A replacement still consumes a new cable. Removals are demolition labour only — '+
    'they never reduce the install count.</div>';
  v.innerHTML = html;
  Array.prototype.forEach.call(v.querySelectorAll("[data-s]"), function(btn){
    btn.addEventListener("click", function(){
      go({screen:"bldgs", site:btn.getAttribute("data-s")});
    });
  });
}

function scBldgs(v){
  var site = NAV.site;
  head(DATA.sites[site].name, site + " · tap a building");
  var bs = DATA.buildings.filter(function(x){ return x.site===site; });
  // zero-record buildings first, then partial, then done
  var rank = {zero:0, part:1, done:2};
  bs = bs.slice().sort(function(a,b){
    var d = rank[bStatus(site,a.b)] - rank[bStatus(site,b.b)];
    return d !== 0 ? d : 0;
  });
  var html = '<div class="grid">';
  bs.forEach(function(x){
    var st = bStatus(site,x.b);
    var a = areasOf(site,x.b), c = closetsOf(site,x.b);
    var conflict = x.extraA !== x.extraB;
    html += '<button class="tile '+st+'" data-b="'+esc(x.b)+'">'+
      '<div class="b">'+esc(x.b)+'</div>'+
      '<div class="d">'+esc(x.desc)+'</div>'+
      '<div class="m"><span>rooms '+countedRooms(site,x.b)+
        '/'+x.classrooms.length+'</span>'+
      '<span>closets '+c.length+'/'+(x.switches.length||0)+'</span></div>'+
      '<div class="m" style="margin-top:3px;color:var(--mut);font-weight:400">'+
        'max '+(x.maxLen?x.maxLen+' ft':'—')+' · extra '+x.extraB+'</div>'+
      (st==="zero" ? '<span class="pri">PRIORITY — NOT STARTED</span>' : '')+
      (conflict ? '<div class="fl">&#9888; extra runs '+x.extraB+' vs '+x.extraA+'</div>' : '')+
      '</button>';
  });
  html += '</div>';
  v.innerHTML = html;
  Array.prototype.forEach.call(v.querySelectorAll("[data-b]"), function(btn){
    btn.addEventListener("click", function(){
      go({screen:"bldg", site:site, b:btn.getAttribute("data-b"), tab:"rooms"});
    });
  });
}

function scBldg(v){
  var site = NAV.site, b = NAV.b, def = bld(site,b);
  head(site + " · Building " + b, def.desc);
  var tabs = [["rooms","Rooms"],["closets","Closets"],["facs","Athletics"],
              ["paths","Pathways"],["qs","Questions"]];
  var html = '<div class="chips" style="margin-bottom:12px">';
  tabs.forEach(function(t){
    html += '<button class="chip sm'+(NAV.tab===t[0]?" on":"")+'" data-t="'+t[0]+'">'+t[1]+'</button>';
  });
  html += '</div>';

  if (def.flags.length) {
    html += '<div class="note flag"><b>Settle in the field</b><ul>' +
      def.flags.map(function(f){ return "<li>"+esc(f)+"</li>"; }).join("") + '</ul></div>';
  }
  html += '<div class="note">District reference — <b>not</b> a basis of bid: '+
    def.rooms+' rooms · '+def.clsDrops+' classroom drops · extra runs <b>'+def.extraB+
    '</b> (Appendix B)'+(def.extraA!==def.extraB?' vs <b>'+def.extraA+'</b> (Appendix A) — count it yourself':'')+
    ' · max run '+(def.maxLen?def.maxLen+' ft':'none given')+
    (def.switches.length?' · switches '+esc(def.switches.join(", ")):' · no switch shown')+'</div>';

  if (NAV.tab === "rooms")   html += listRooms(site,b,def);
  if (NAV.tab === "closets") html += listClosets(site,b,def);
  if (NAV.tab === "facs")    html += listFacs(site,b);
  if (NAV.tab === "paths")   html += listPaths(site,b);
  if (NAV.tab === "qs")      html += listQs(site,b);

  v.innerHTML = html;
  Array.prototype.forEach.call(v.querySelectorAll("[data-t]"), function(btn){
    btn.addEventListener("click", function(){
      NAV.tab = btn.getAttribute("data-t"); render();
    });
  });
  wireList(site,b,def);
}

/* --- rooms tab ------------------------------------------------- */
function listRooms(site,b,def){
  var html = "";
  var stubs = def.classrooms.map(function(r){ return [r,true]; })
      .concat(def.spaces.map(function(r){ return [r,false]; }));
  var recs = vals(S.areas).filter(function(a){ return a.site===site && a.b===b; });
  var byName = {};
  recs.forEach(function(r){ byName[r.room] = r; });

  stubs.forEach(function(p){
    var name = p[0], isRoom = p[1], r = byName[name];
    var on = r && r.touched;
    html += '<button class="row'+(on?" on":"")+'" data-room="'+esc(name)+'" data-isroom="'+
      (isRoom?1:0)+'">'+
      '<span class="tick">'+(on?"&#10003;":"&#9744;")+'</span>'+
      '<span class="rl">'+esc(name)+
        (isRoom?"":'<small>non-classroom space</small>')+
        (on&&r.cne?'<small style="color:var(--warn)">route not established</small>':'')+
      '</span>'+
      '<span class="rr">'+(on ? totNew(r)+" new"+(r.routeFt!==null?" · "+r.routeFt+" ft":"")
                              : "")+'</span></button>';
  });
  // ad-hoc rooms the documents do not know about
  recs.forEach(function(r){
    var known = stubs.some(function(p){ return p[0]===r.room; });
    if (known || !r.touched) return;
    html += '<button class="row on" data-room="'+esc(r.room)+'" data-isroom="1">'+
      '<span class="tick">&#10003;</span><span class="rl">'+esc(r.room)+
      '<small style="color:var(--bad)">not in the reference list</small></span>'+
      '<span class="rr">'+totNew(r)+' new</span></button>';
  });
  html += '<button class="ex-btn" id="addroom" style="margin-top:12px">+ Room / space not listed</button>';
  if (S.lastArea && S.areas[S.lastArea] && S.areas[S.lastArea].b === b) {
    html += '<div class="note">Tip: open a room and use <b>Same as last</b> to clone the '+
      'previous record. That is how 30 relocatables take eight minutes.</div>';
  }
  return html;
}

function wireList(site,b,def){
  Array.prototype.forEach.call(document.querySelectorAll("[data-room]"), function(btn){
    btn.addEventListener("click", function(){
      go({screen:"area", site:site, b:b, room:btn.getAttribute("data-room"),
          isRoom: btn.getAttribute("data-isroom")==="1"});
    });
  });
  var ar = $("addroom");
  if (ar) ar.addEventListener("click", function(){
    var n = prompt("Room or space name (as it is signed on the door):");
    if (n && n.trim()) go({screen:"area", site:site, b:b, room:n.trim(), isRoom:true, adhoc:true});
  });
  Array.prototype.forEach.call(document.querySelectorAll("[data-cl]"), function(btn){
    btn.addEventListener("click", function(){
      go({screen:"closet", site:site, b:b, id:btn.getAttribute("data-cl")||null});
    });
  });
  Array.prototype.forEach.call(document.querySelectorAll("[data-fac]"), function(btn){
    btn.addEventListener("click", function(){
      go({screen:"fac", site:site, b:b, fac:btn.getAttribute("data-fac"),
          id:btn.getAttribute("data-fid")||null});
    });
  });
  var ap = $("addpath");
  if (ap) ap.addEventListener("click", function(){
    go({screen:"area", site:site, b:b, room:"", isRoom:false, pathOnly:true});
  });
  var aq = $("addq");
  if (aq) aq.addEventListener("click", function(){ go({screen:"q", site:site, b:b}); });
  Array.prototype.forEach.call(document.querySelectorAll("[data-q]"), function(btn){
    btn.addEventListener("click", function(){
      go({screen:"q", site:site, b:b, id:btn.getAttribute("data-q")});
    });
  });
}

/* --- closets tab ----------------------------------------------- */
function listClosets(site,b,def){
  var recs = closetsOf(site,b);
  var covered = {};
  recs.forEach(function(c){ (c.switches||[]).forEach(function(s){ covered[s]=c.id; }); });
  var html = '<div class="note">One record per <b>physical closet</b>. If two switches '+
    'share a cabinet, tick them both into the same record — it changes the cabinet and '+
    'patch-panel count. <b>Fiber is out of scope: record it and protect it.</b></div>';
  def.switches.forEach(function(sw){
    var cid = covered[sw];
    html += '<button class="row'+(cid?" on":"")+'" data-cl="'+esc(cid||"")+'">'+
      '<span class="tick">'+(cid?"&#10003;":"&#9744;")+'</span>'+
      '<span class="rl" style="font-size:14px">'+esc(sw)+
      (cid?'<small>in record '+esc(cid)+'</small>':'')+'</span></button>';
  });
  if (!def.switches.length) html += '<div class="note">No switch listed for this building '+
    'in the District documents. If you find a closet here, add it.</div>';
  recs.forEach(function(c){
    if ((c.switches||[]).length) return;
    html += '<button class="row on" data-cl="'+esc(c.id)+'"><span class="tick">&#10003;</span>'+
      '<span class="rl">'+esc(c.id)+'<small>no switch assigned</small></span></button>';
  });
  html += '<button class="ex-btn" data-cl="" style="margin-top:12px">+ New closet record</button>';
  return html;
}

/* --- athletics tab --------------------------------------------- */
function listFacs(site,b){
  var mine = DATA.facilities.filter(function(f){ return f.site===site && f.priceTo===b; });
  var recs = facsOf(site,b);
  var html = "";
  if (!mine.length && !recs.length) {
    html += '<div class="note">No athletic facility prices to building <b>'+esc(b)+
      '</b>. Appendix B puts athletic equipment on the <b>Football</b>, <b>Pool</b> and '+
      '<b>FM</b> lines at RHS.</div>';
  } else {
    html += '<div class="note flag"><b>The District has not inventoried these.</b> '+
      'Establish quantities yourself. The decisive field is <b>interface type</b> — '+
      '"replace the cabling" means something different for a scoreboard on a '+
      'proprietary harness than for a PoE camera.</div>';
  }
  mine.forEach(function(f){
    var got = recs.filter(function(r){ return r.fac===f.name; });
    html += '<button class="row'+(got.length?" on":"")+'" data-fac="'+esc(f.name)+'">'+
      '<span class="tick">'+(got.length?"&#10003;":"&#9744;")+'</span>'+
      '<span class="rl" style="font-size:15px">'+esc(f.name)+
      '<small>'+esc(f.note.slice(0,96))+(f.note.length>96?"…":"")+'</small></span>'+
      '<span class="rr">'+(got.length?got.length+" rec":"")+'</span></button>';
  });
  recs.forEach(function(r){
    html += '<button class="row on" data-fac="'+esc(r.fac)+'" data-fid="'+esc(r.id)+'">'+
      '<span class="tick">&#8250;</span><span class="rl" style="font-size:14px">'+
      esc(r.fac)+'<small>'+esc(r.equip||"(no equipment noted)")+' · '+
      esc(r.iface||"interface not set")+'</small></span>'+
      '<span class="rr">'+(r.newDrops||0)+' new</span></button>';
  });
  return html;
}

/* --- pathways / questions tabs --------------------------------- */
function listPaths(site,b){
  var recs = pathsOf(site,b);
  var html = '<div class="note">Pathways are logged in the room records as a route ID '+
    'plus a note, and reconstructed at the desk from photos. Use this only for a shared '+
    'route worth its own row.</div>';
  recs.forEach(function(p){
    html += '<div class="row on"><span class="tick">&#10003;</span><span class="rl">'+
      esc(p.id)+'<small>'+esc(p.type||"")+' · '+(p.ft||"?")+' ft</small></span></div>';
  });
  return html;
}
function listQs(site,b){
  var recs = vals(S.qs).filter(function(q){ return q.site===site && q.b===b; });
  var html = '<div class="note flag"><b>Verbal answers at the walk are not binding.</b> '+
    'Addendum No. 3: no response is given by telephone or in conversation at the project '+
    'walk. Ask verbally only to aim your eyes — then file it in writing. '+
    'Send the first batch '+esc(DATA.walk.qTarget)+'.</div>';
  recs.forEach(function(q){
    html += '<button class="row on" data-q="'+esc(q.id)+'"><span class="tick">&#10003;</span>'+
      '<span class="rl">'+esc(q.id)+'<small>'+esc((q.topic||"")+" — "+(q.text||"").slice(0,70))+
      '</small></span></button>';

  return html;
}

/* ------------------------------------------------------------------
   7. AREA FORM — the ~20 second path
   ------------------------------------------------------------------ */
function areaId(site,b,room){
  return site+"-"+b+"-"+String(room).replace(/[^A-Za-z0-9]/g,"")+"-"+devCode()+
         pad2(nextSeq("a"));
}
function findArea(site,b,room){
  var r = vals(S.areas).filter(function(a){ return a.site===site&&a.b===b&&a.room===room; });
  return r.length ? r[0] : null;
}

function scArea(v){
  var site=NAV.site, b=NAV.b, room=NAV.room, def=bld(site,b);
  var r = findArea(site,b,room);
  var isNew = !r;
  if (!r) {
    r = {id:areaId(site,b,room), site:site, b:b, room:room,
         kindRoom: !!NAV.isRoom,     // counted classroom vs non-classroom space
         type: NAV.isRoom ? "Classroom" : "Common area",
         closet: DATA.roomCloset[site+"|"+room] || (def.switches[0]||""),
         clg:null, wall:null, spk:null, oth:0, remove:null,
         routeFt:null, cne:null, loops:DATA.standard.loops,
         basis:"Measured / counted", ceil:null, ht:null, acc:null,
         rid:"", rdiff:null, cut:"", photoFrom:null, photoTo:null,
         notes:"", touched:false};
    S.areas[r.id] = r;
  }
  head(site+" "+b+" · "+room, r.id);

  function set(k,val){ r[k]=val; r.touched=true; journal("areas",r.id,k,val); queueSave(); }

  var std = DATA.standard;
  var stdOn = r.clg===std.ceiling && r.wall===std.wall && r.spk===std.speaker;

  var html = "";
  if (def.flags.length && isNew) {
    html += '<div class="note flag"><b>In this building</b><ul>'+
      def.flags.map(function(f){return "<li>"+esc(f)+"</li>";}).join("")+'</ul></div>';
  }

  html += '<button class="big-ok'+(stdOn?" on":"")+'" id="std">'+
    (stdOn ? "&#10003; 12-DROP STANDARD SET" : "&#10003; CONFIRM 12-DROP STANDARD")+
    '<div style="font-size:12.5px;font-weight:600;margin-top:4px;opacity:.9">'+
    '4 ceiling &middot; 6 wall &middot; 2 speaker &nbsp;=&nbsp; 12 new cables</div></button>';

  if (S.lastArea && S.areas[S.lastArea] && S.lastArea !== r.id) {
    html += '<button class="ex-btn" id="samelast" style="margin-top:8px">'+
      'Same as last &nbsp;(' + esc(S.areas[S.lastArea].room) + ')</button>';
  }

  html += '<div class="sec">Identity</div>';
  html += chipsFld("Area type","type",DATA.enums.areaType,r.type);
  if (def.switches.length) {
    html += chipsFld("Serving closet","closet",def.switches,r.closet);
  }

  /* ---- the two counting blocks ---- */
  html += '<div class="sec">Counts</div>';
  html += '<div class="block new"><h4>New CAT6A to install</h4>'+
    '<div class="why">Includes every replacement. A replacement drop still consumes a '+
    'new cable.</div>'+
    stepper("AP / ceiling","clg",r.clg)+
    stepper("Wall","wall",r.wall)+
    stepper("IP speaker","spk",r.spk)+
    stepper("Other (cameras, horns, devices)","oth",r.oth)+
    '<div class="tot"><span>TOTAL NEW DROPS</span><span class="tv" id="totnew">'+
    (r.clg===null&&r.wall===null&&r.spk===null&&!r.oth ? "—" : totNew(r))+'</span></div></div>';

  html += '<div class="ruleline">existing to replace &nbsp;+&nbsp; additional required '+
    '&nbsp;=&nbsp; total to install</div>';

  html += '<div class="block rm"><h4>Existing cable to remove</h4>'+
    '<div class="why">Demolition labour only. Does <b>not</b> reduce the install count above.</div>'+
    stepper("Existing drops to remove","remove",r.remove)+
    '<div class="chips" style="margin-top:6px">'+
    '<button class="chip sm" data-rmq="same">Same as new</button>'+
    '<button class="chip sm" data-rmq="0">None</button>'+
    '<button class="chip sm" data-rmq="unk">Unknown</button></div></div>';

  /* ---- route length ---- */
  html += '<div class="sec">Route length — the money variable</div>';
  html += '<div class="fld"><label>Route length PER CABLE (ft) — follow the actual route, '+
    'never straight-line</label>'+
    '<div class="kp-val'+(r.cne?" cne":"")+'" id="kpval">'+
      (r.cne ? "ROUTE NOT ESTABLISHED<br>"+esc(r.cne)
             : (r.routeFt===null?"—":r.routeFt))+'</div>'+
    '<div class="kp" id="kp">'+
      [1,2,3,4,5,6,7,8,9].map(function(n){return '<button data-k="'+n+'">'+n+'</button>';}).join("")+
      '<button data-k="0" class="wide">0</button><button data-k="del">&#9003;</button>'+
    '</div>'+
    '<button class="cne-btn'+(r.cne?" on":"")+'" id="cne">&#9888; COULD NOT ESTABLISH ROUTE</button>'+
    '<div id="cnereasons"></div>'+
    (def.maxLen ? '<div class="hint">Appendix C worst-case run for this building: '+
      def.maxLen+' ft.</div>' : '')+
    '<div id="overmax"></div></div>';

  html += chipsFld("Loops / dressing per cable (ft)","loops",[0,5,10,15,20],r.loops,
    "Loops only. The District's 30% is a procurement waste allowance — added at the desk, not here.");

  html += '<div class="sub-live'+(sub(r)===null?" none":"")+'" id="sublive">'+subText(r)+'</div>';

  html += chipsFld("Count basis","basis",DATA.enums.countBasis,r.basis);

  /* ---- photos ---- */
  html += '<div class="sec">Photos</div>'+
    '<div class="note">Shoot on the <b>iPhone</b>. Photograph a written marker first:<br>'+
    '<b>'+esc(site+" | Building "+b+" | "+room+(r.closet?" | "+r.closet:""))+'</b><br>'+
    'then overview &rarr; devices &rarr; pathways &rarr; problems. IDs get assigned at '+
    'the desk from the time range.</div>'+
    '<div class="chips"><button class="chip" id="phfrom">'+
      (r.photoFrom?"From "+esc(r.photoFrom):"&#9654; Start "+hhmm())+'</button>'+
    '<button class="chip" id="phto">'+
      (r.photoTo?"To "+esc(r.photoTo):"&#9632; Stop")+'</button></div>';

  /* ---- tier 2 ---- */
  html += '<details class="t2"><summary>Details</summary><div class="in">'+
    chipsFld("Ceiling type","ceil",DATA.enums.ceilingType,r.ceil)+
    chipsFld("Working height (ft)","ht",[8,9,10,12,14,16,20,"24+"],r.ht)+
    chipsFld("Access equipment","acc",DATA.enums.accessEquip,r.acc)+
    chipsFld("Removal difficulty","rdiff",DATA.enums.removalDifficulty,r.rdiff)+
    '<div class="fld"><label>Pathway / route ID</label>'+
      '<input type="text" id="rid" value="'+esc(r.rid)+'" autocapitalize="off" '+
      'autocorrect="off" spellcheck="false"></div>'+
    '<div class="fld"><label>Cutover / outage needs</label>'+
      '<input type="text" id="cut" value="'+esc(r.cut)+'"></div>'+
    '</div></details>';

  html += '<div class="fld"><label>Notes / unusual conditions</label>'+
    '<textarea id="notes" autocapitalize="sentences">'+esc(r.notes)+'</textarea>'+
    '<div class="hint">Dictate it — tap the mic on the keyboard.</div></div>';

  v.innerHTML = html;

  $("savebar").className = "save";
  $("savebar").innerHTML = '<div class="two">'+
    '<button class="alt" id="delrec">Delete</button>'+
    '<button id="savenext">Save &amp; next &rsaquo;</button></div>';

  /* ---- wiring ---- */
  function repaintCounts(){
    $("totnew").textContent = (r.clg===null&&r.wall===null&&r.spk===null&&!r.oth)
      ? "—" : totNew(r);
    var sl = $("sublive");
    sl.textContent = subText(r);
    sl.className = "sub-live" + (sub(r)===null ? " none" : "");
    var om = $("overmax");
    om.innerHTML = (def.maxLen && r.routeFt && r.routeFt > def.maxLen)
      ? '<div class="overmax">&#9888; longer than Appendix C\'s '+def.maxLen+
        ' ft worst case — confirm you followed the real route</div>' : "";
  }
  function repaintKp(){
    var kv = $("kpval");
    kv.className = "kp-val" + (r.cne ? " cne" : "");
    kv.innerHTML = r.cne ? "ROUTE NOT ESTABLISHED<br>"+esc(r.cne)
                         : (r.routeFt===null ? "—" : r.routeFt);
    $("cne").className = "cne-btn" + (r.cne ? " on" : "");
    repaintCounts();
  }

  $("std").addEventListener("click", function(){
    set("clg",std.ceiling); set("wall",std.wall); set("spk",std.speaker);
    if (r.oth===null) set("oth",0);
    if (r.loops===null||r.loops===undefined) set("loops",std.loops);
    if (!r.basis) set("basis","Estimated");
    render();
  });
  var sl2 = $("samelast");
  if (sl2) sl2.addEventListener("click", function(){
    var p = S.areas[S.lastArea];
    ["type","closet","clg","wall","spk","oth","remove","routeFt","cne","loops",
     "basis","ceil","ht","acc","rdiff"].forEach(function(k){ r[k]=p[k]; });
    r.touched = true; journal("areas",r.id,"sameAsLast",p.id); flushSave(); render();
  });

  wireChips(v, function(k,val){ set(k,val); if(k==="loops") repaintCounts(); });
  wireSteppers(v, r, function(k,val){ set(k,val); repaintCounts(); });

  Array.prototype.forEach.call(v.querySelectorAll("[data-rmq]"), function(btn){
    btn.addEventListener("click", function(){
      var m = btn.getAttribute("data-rmq");
      if (m==="same") set("remove", totNew(r));
      else if (m==="0") set("remove", 0);
      else { set("remove", null); set("notes", (r.notes?r.notes+" ":"")+"[existing count unknown]"); }
      render();
    });
  });

  Array.prototype.forEach.call(v.querySelectorAll("#kp [data-k]"), function(btn){
    btn.addEventListener("click", function(){
      var k = btn.getAttribute("data-k");
      if (r.cne) { r.cne=null; journal("areas",r.id,"cne","cleared"); }

function chipsFld(label,key,opts,cur,hint){
  var h = '<div class="fld"><label>'+esc(label)+'</label><div class="chips">';
  opts.forEach(function(o){
    h += '<button class="chip'+(String(cur)===String(o)?" on":"")+'" data-ck="'+esc(key)+
         '" data-cv="'+esc(o)+'">'+esc(o)+'</button>';
  });
  h += '</div>'+(hint?'<div class="hint">'+esc(hint)+'</div>':'')+'</div>';
  return h;
}
function wireChips(root, set){
  Array.prototype.forEach.call(root.querySelectorAll("[data-ck]"), function(btn){
    btn.addEventListener("click", function(){
      var k = btn.getAttribute("data-ck"), raw = btn.getAttribute("data-cv");
      var v = /^-?\d+$/.test(raw) ? parseInt(raw,10) : raw;
      set(k, v);
      var sibs = btn.parentNode.querySelectorAll("[data-ck='"+k+"']");
      Array.prototype.forEach.call(sibs, function(s){ s.className = "chip" +
        (s.className.indexOf("sm")>=0?" sm":""); });
      btn.className = "chip" + (btn.className.indexOf("sm")>=0?" sm":"") + " on";
    });
  });
}
function stepper(label,key,val){
  return '<div class="step"><span class="sl">'+esc(label)+'</span>'+
    '<button class="pm" data-sk="'+key+'" data-sd="-1">&minus;</button>'+
    '<span class="sv" data-sv="'+key+'">'+(val===null||val===undefined?"—":val)+'</span>'+
    '<button class="pm" data-sk="'+key+'" data-sd="1">+</button></div>';
}
function wireSteppers(root, rec, set){
  Array.prototype.forEach.call(root.querySelectorAll("[data-sk]"), function(btn){
    btn.addEventListener("click", function(){
      var k = btn.getAttribute("data-sk"), d = parseInt(btn.getAttribute("data-sd"),10);
      var cur = rec[k]; if (cur===null||cur===undefined) cur = 0;
      var nv = Math.max(0, cur + d);
      set(k, nv);
      var sv = root.querySelector("[data-sv='"+k+"']");
      if (sv) sv.textContent = nv;
    });
  });
}
function numRow(items){
  var h = '<div class="fld"><div style="display:flex;gap:7px">';
  items.forEach(function(it){
    h += '<div style="flex:1"><label style="font-size:12px">'+esc(it[1])+'</label>'+
      '<input type="text" inputmode="numeric" pattern="[0-9]*" data-nk="'+it[0]+
      '" value="'+(it[2]===null||it[2]===undefined?"":it[2])+
      '" autocapitalize="off" autocorrect="off" spellcheck="false"></div>';
  });
  h += '</div></div>';
  return h;
}
function wireNums(root, set){
  Array.prototype.forEach.call(root.querySelectorAll("[data-nk]"), function(inp){
    var h = function(){
      var v = inp.value.replace(/[^0-9]/g,"");
      if (v !== inp.value) inp.value = v;
      set(inp.getAttribute("data-nk"), v===""?null:parseInt(v,10));
    };
    inp.addEventListener("input", h);
    inp.addEventListener("blur", h);
  });
}
/* uncontrolled text: dictation fires composition events that fight re-render */
function bindText(root,id,set){
  var el = root.querySelector("#"+id); if (!el) return;
  var t=null;
  el.addEventListener("input", function(){
    clearTimeout(t); var self=this;
    t = setTimeout(function(){ set(self.value); }, 350);
  });
  el.addEventListener("blur", function(){ clearTimeout(t); set(this.value); });
}

function buildExport(){
  var t1 = siteTotals("RHS"), t2 = siteTotals("RES");
  function zeroList(site){
    return DATA.buildings.filter(function(x){
      return x.site===site && bStatus(site,x.b)==="zero"; })
      .map(function(x){ return x.b; }).join(", ") || "none";
  }
  var cneList = vals(S.areas).filter(function(a){ return a.touched && a.cne; })
    .map(function(a){ return a.id+" ("+a.cne+")"; });

  var out = "﻿=== ROCKLIN RFP 26-110 FIELD EXPORT ===\r\n";
  out += "device "+devCode()+"  |  "+new Date().toString()+"\r\n";
  out += "write #"+(meta.seq||0)+"  |  storage "+(storageOk?"OK":"FAILED: "+storageErr)+"\r\n\r\n";
  out += "--- SUMMARY ---\r\n";
  [["RHS",t1],["RES",t2]].forEach(function(p){
    var s=p[0], t=p[1];
    out += s+": "+t.done+" done / "+t.part+" partial / "+t.zero+" ZERO of "+t.lines+
      " lines · "+t.areas+" areas · "+t.closets+" closets · "+t.facs+" facilities · "+
      t.drops+" new drops · "+t.ft.toLocaleString()+" ft\r\n";
    out += "  ZERO-RECORD BUILDINGS: "+zeroList(s)+"\r\n";
  });
  out += "ROUTE NOT ESTABLISHED: "+cneList.length+"\r\n";
  cneList.forEach(function(x){ out += "  "+x+"\r\n"; });
  out += "QUESTIONS RAISED IN FIELD: "+vals(S.qs).length+"\r\n\r\n";

  var sheets = [["Areas",DATA.columns.Areas,areaRows()],
                ["Closets",DATA.columns.Closets,closetRows()],
                ["Pathways",DATA.columns.Pathways,pathRows()],
                ["Questions",DATA.columns.Questions,qRows()],
                ["Photos",DATA.columns.Photos,photoRows()]];
  sheets.forEach(function(s){
    out += "--- CSV: "+s[0]+" ("+s[2].length+" rows) ---\r\n";
    out += s[1].map(csvCell).join(",")+"\r\n";
    if (s[2].length) out += csvRows(s[2])+"\r\n";
    out += "\r\n";
  });
  out += "--- JOURNAL (last field changes) ---\r\n"+(lsGet(KJ)||"(none)")+"\r\n\r\n";
  out += "--- JSON ---\r\n"+JSON.stringify(S)+"\r\n";
  return out;
}

function scExport(v){
  head("Export", "copy it out, then email it to yourself");
  var t1=siteTotals("RHS"), t2=siteTotals("RES");
  var payload = buildExport();            // built eagerly: clipboard needs it sync
  v.innerHTML =
    '<div class="sum">'+esc(payload.split("--- CSV:")[0].replace("﻿",""))+'</div>'+
    '<button class="ex-btn pri" id="copy">Copy everything</button>'+
    '<button class="ex-btn" id="share">Share / email&hellip;</button>'+
    '<button class="ex-btn" id="showraw">Show raw text — the path that cannot fail</button>'+
    '<div class="note">Checkpoint after RHS, before driving to RES, and again at the end. '+
    'Paste it into Mail <b>and</b> a new Apple Note — two silos, no network needed to '+
    'write the Note.</div>'+
    '<textarea class="raw hidden" id="raw" readonly></textarea>';

  $("copy").addEventListener("click", function(){
    var ok = false;
    try { if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(payload); ok = true; } } catch(e){}
    var ta = $("raw"); ta.value = payload; ta.className = "raw"; ta.select();
    if (!ok) { try { ok = document.execCommand("copy"); } catch(e){} }
    this.textContent = ok ? "Copied ✓ — now paste into Mail" : "Select the text below ↓";
    S.checkpointAt = new Date().toISOString(); flushSave();
  });
  $("share").addEventListener("click", function(){
    S.checkpointAt = new Date().toISOString(); flushSave();
    try {
      if (navigator.share) { navigator.share({title:"Rocklin field export", text:payload}); return; }
    } catch(e){}
    var ta = $("raw"); ta.value = payload; ta.className="raw"; ta.select();
    this.textContent = "No share sheet — select the text below ↓";
  });
  $("showraw").addEventListener("click", function(){
    var ta = $("raw"); ta.value = payload; ta.className = "raw"; ta.select();
  });
}

function scMissing(v){
  head("What's missing", "pre-departure checklist");
  var html = "";
  ["RHS","RES"].forEach(function(site){
    var t = siteTotals(site);
    html += '<div class="sec">'+site+" — "+t.done+" done, "+t.part+" partial, "+t.zero+" ZERO</div>";
    DATA.buildings.filter(function(x){ return x.site===site; }).forEach(function(x){
      var st = bStatus(site,x.b);
      if (st === "done") return;
      var a = areasOf(site,x.b), c = closetsOf(site,x.b);
      var why = [];
      if (!recCount(site,x.b)) why.push("NO RECORDS AT ALL");
      else {
        var hr = countedRooms(site,x.b);
        if (hr < x.classrooms.length)
          why.push((x.classrooms.length-hr)+" of "+x.classrooms.length+" rooms not captured");
        var noLen = a.filter(function(r){ return r.routeFt===null && !r.cne; }).length;
        if (noLen) why.push(noLen+" record(s) with no route length and no reason");
        if (x.switches.length && !c.length) why.push("no closet record ("+x.switches.length+" switch(es) listed)");
      }
      html += '<button class="row" data-go="'+esc(site)+'|'+esc(x.b)+'">'+
        '<span class="tick" style="color:'+(st==="zero"?"var(--bad)":"var(--warn)")+'">'+
        (st==="zero"?"&#9888;":"&#8943;")+'</span>'+
        '<span class="rl">'+esc(x.b)+' — '+esc(x.desc)+'<small>'+esc(why.join(" · "))+
        '</small></span></button>';
    });
  });
  if (!html) html = '<div class="note">Nothing outstanding. Every building has records, '+
    'every record has a length or a stated reason, and every building with a listed switch '+
    'has a closet record.</div>';
  v.innerHTML = html;
  Array.prototype.forEach.call(v.querySelectorAll("[data-go]"), function(btn){
    btn.addEventListener("click", function(){
      var p = btn.getAttribute("data-go").split("|");
      go({screen:"bldg", site:p[0], b:p[1], tab:"rooms"});
    });
  });
}

$("exp").addEventListener("click", function(){ go({screen:"exportv"}); });
$("miss").addEventListener("click", function(){ go({screen:"missing"}); });
